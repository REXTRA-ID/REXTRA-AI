# docker-compose.dev.yml
services:
  db:
    image: postgres:14
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-kenali_diri}
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: always
    ports:
      - "6380:6379"

  api:
    build:
      context: .
      dockerfile: ./docker/dev/Dockerfile
    restart: always
    ports:
      - "8010:8000"
    depends_on:
      - db
      - redis
    volumes:
      - .:/app
    environment:
      APP_NAME: "Kenali Diri API (Dev)"
      DATABASE_URL: postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-kenali_diri}
      REDIS_URL: redis://redis:6379/0
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_BASE_URL: https://openrouter.ai/api/v1
      OPENROUTER_MODEL: google/gemini-2.0-flash-exp
      SECRET_KEY: ${SECRET_KEY:-dev-secret}

volumes:
  postgres_dev_data:
